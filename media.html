<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>감초식당 MEDIA | 제주 로컬의 순간들</title>
<meta name="description" content="감초식당의 하루, 제주 로컬의 분위기와 순간들을 담은 미디어">

<style>

body{
margin:0;
font-family:'Pretendard', Arial;
background:#0a0a0a;
color:#f5f5f5;
}

/* HERO VIDEO */
.hero{
height:100vh;
position:relative;
overflow:hidden;
}

.hero video{
width:100%;
height:100%;
object-fit:cover;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
}

.hero-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:2;
}

.hero-text h1{
font-size:42px;
margin:0;
}

.hero-text p{
opacity:0.8;
margin-top:10px;
}

/* SECTION */
.section{
padding:120px 20px;
max-width:1100px;
margin:auto;
text-align:center;
}

.section h2{
font-size:28px;
margin-bottom:40px;
}

/* GALLERY */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
}

.grid img{
width:100%;
height:250px;
object-fit:cover;
border-radius:12px;
transition:0.3s;
}

.grid img:hover{
transform:scale(1.03);
}

/* STORY BLOCK */
.story{
background:#111;
padding:100px 20px;
text-align:center;
}

.story p{
max-width:700px;
margin:auto;
opacity:0.85;
line-height:1.8;
}

/* CTA */
.cta{
padding:120px 20px;
text-align:center;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:#c8a96a;
color:#111;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

</style>
</head>

<body>

<!-- HERO VIDEO -->
<div class="hero">

  <video autoplay muted loop>
    <source src="jeju-food.mp4" type="video/mp4">
  </video>

  <div class="hero-text">
    <h1>제주의 하루는 이렇게 익어갑니다</h1>
    <p>감초식당의 순간들</p>
  </div>

</div>

<!-- GALLERY -->
<div class="section">
  <h2>분위기</h2>

  <div class="grid">
    <img src="m1.jpg">
    <img src="m2.jpg">
    <img src="m3.jpg">
    <img src="m4.jpg">
  </div>
</div>

<!-- COOKING -->
<div class="section">
  <h2>조리 과정</h2>

  <div class="grid">
    <img src="cook1.jpg">
    <img src="cook2.jpg">
    <img src="cook3.jpg">
  </div>
</div>

<!-- STORY MOMENT -->
<div class="story">
  <h2>사람이 만드는 맛</h2>
  <p>
  음식은 기술이 아니라 시간입니다.<br><br>
  매일 같은 자리에서, 같은 방식으로,<br>
  누군가의 하루를 따뜻하게 만드는 일.
  </p>
</div>

<!-- PEOPLE -->
<div class="section">
  <h2>우리의 순간</h2>

  <div class="grid">
    <img src="people1.jpg">
    <img src="people2.jpg">
    <img src="people3.jpg">
  </div>
</div>

<!-- CTA -->
<div class="cta">
  <h2>이 분위기를 직접 느껴보세요</h2>
  <a href="/menu" class="btn">메뉴 보기</a>
</div>

</body>
</html>
