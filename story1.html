<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>감초식당 이야기 | 30년의 한 그릇</title>
<meta name="description" content="감초식당이 걸어온 30년의 이야기, 변하지 않는 손맛과 제주 로컬의 온기">

<style>
body{
margin:0;
font-family:'Pretendard', Arial;
background:#0e0e0e;
color:#f5f5f5;
line-height:1.6;
}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:url('story-hero.jpg') center/cover no-repeat;
position:relative;
}

.hero::after{
content:"";
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.55);
}

.hero-content{
position:relative;
z-index:2;
}

.hero h1{
font-size:42px;
letter-spacing:-1px;
margin:0;
}

.hero p{
font-size:18px;
opacity:0.85;
margin-top:10px;
}

.section{
padding:120px 20px;
max-width:900px;
margin:auto;
text-align:center;
}

.section h2{
font-size:28px;
margin-bottom:20px;
}

.section p{
font-size:16px;
opacity:0.85;
}

.timeline{
display:flex;
flex-direction:column;
gap:40px;
margin-top:40px;
}

.time-item{
border-left:2px solid #c8a96a;
padding-left:20px;
text-align:left;
}

.cta{
background:#111;
padding:120px 20px;
text-align:center;
}

.button{
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:#c8a96a;
color:#111;
text-decoration:none;
font-weight:bold;
border-radius:30px;
}

.button:hover{
background:#e0c07a;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>30년 동안 변하지 않은 한 그릇의 온기</h1>
    <p>감초식당이 지켜온 제주의 시간</p>
  </div>
</div>

<!-- STORY -->
<div class="section">
  <h2>감초식당의 시작</h2>
  <p>
  제주 보성시장 작은 골목에서 시작된 한 그릇.<br>
  어머니의 손맛을 그대로 이어받아 오늘까지 이어왔습니다.
  </p>
</div>

<!-- TIMELINE -->
<div class="section">
  <h2>시간이 쌓아온 맛</h2>

  <div class="timeline">
    <div class="time-item">
      <h3>1990년대</h3>
      <p>작은 시장 식당으로 시작된 첫걸음</p>
    </div>

    <div class="time-item">
      <h3>2000년대</h3>
      <p>단골 손님들이 늘어나며 지역 맛집으로 자리잡음</p>
    </div>

    <div class="time-item">
      <h3>현재</h3>
      <p>제주를 찾는 여행객들이 꼭 들르는 식당</p>
    </div>
  </div>
</div>

<!-- VALUES -->
<div class="section">
  <h2>우리가 지키는 것</h2>
  <p>
  매일 아침 직접 고른 재료<br>
  변하지 않는 조리 방식<br>
  그리고 사람을 위한 따뜻한 한 끼
  </p>
</div>

<!-- CTA -->
<div class="cta">
  <h2>감초식당에서 당신의 한 끼를 기다립니다</h2>
  <a href="tel:000-0000-0000" class="button">전화 예약</a>
</div>

</body>
</html>
