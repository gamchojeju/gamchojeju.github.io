<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>감초식당 이야기 | 30년 제주 로컬의 맛</title>
<meta name="description" content="제주 보성시장에서 시작된 감초식당의 이야기. 30년 동안 변하지 않은 손맛과 제주 로컬의 정성">

<!-- SEO -->
<meta property="og:title" content="감초식당 STORY">
<meta property="og:description" content="30년 동안 이어온 제주 로컬의 한 그릇 이야기">
<meta property="og:type" content="website">

<!-- 구조화 데이터 -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "감초식당",
  "description": "제주 연동의 로컬 맛집",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "제주"
  }
}
</script>

<style>

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:'Pretendard', Arial;
background:#0b0b0b;
color:#f5f5f5;
}

/* HERO */
.hero{
height:100vh;
background:url('story-hero.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
position:relative;
text-align:center;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}

.hero-content{
position:relative;
z-index:2;
max-width:800px;
padding:20px;
}

.hero h1{
font-size:44px;
margin:0;
}

.hero p{
opacity:0.8;
margin-top:10px;
}

/* SECTION */
.section{
padding:120px 20px;
max-width:900px;
margin:auto;
text-align:center;
}

.section h2{
font-size:30px;
margin-bottom:20px;
}

.section p{
opacity:0.85;
}

/* TIMELINE */
.timeline{
margin-top:50px;
display:flex;
flex-direction:column;
gap:40px;
text-align:left;
border-left:2px solid #c8a96a;
padding-left:20px;
}

.timeline h3{
margin:0;
color:#c8a96a;
}

/* CTA */
.cta{
background:#111;
padding:100px 20px;
text-align:center;
}

.btn{
display:inline-block;
margin-top:20px;
padding:14px 30px;
background:#c8a96a;
color:#111;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

/* FADE IN */
.fade{
opacity:0;
transform:translateY(40px);
transition:all 1s ease;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

/* TOP NAV */
.nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
gap:20px;
padding:15px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
z-index:10;
}

.nav a{
color:#fff;
text-decoration:none;
font-size:14px;
opacity:0.8;
}

.nav a:hover{
opacity:1;
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <a href="/index1.html">HOME</a>
  <a href="/story1.html">STORY</a>
  <a href="/menu1.html">MENU</a>
  <a href="/media1.html">MEDIA</a>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>30년 동안 변하지 않은 한 그릇</h1>
    <p>제주 보성시장에서 시작된 감초식당의 이야기</p>
  </div>
</div>

<!-- STORY -->
<div class="section fade">
  <h2>시작</h2>
  <p>
  제주 보성시장의 작은 골목에서 시작된 식당.<br>
  어머니의 손맛을 그대로 이어받아 지금까지 이어왔습니다.
  </p>
</div>

<!-- TIMELINE -->
<div class="section fade">
  <h2>시간의 흐름</h2>

  <div class="timeline">
    <div>
      <h3>1990년대</h3>
      <p>시장 안 작은 식당으로 시작</p>
    </div>

    <div>
      <h3>2000년대</h3>
      <p>지역 주민들의 단골 식당으로 성장</p>
    </div>

    <div>
      <h3>현재</h3>
      <p>제주 여행객이 찾는 로컬 맛집</p>
    </div>
  </div>
</div>

<!-- VALUES -->
<div class="section fade">
  <h2>우리가 지키는 것</h2>
  <p>
  매일 직접 고른 재료<br>
  변하지 않는 조리 방식<br>
  사람을 위한 따뜻한 한 끼
  </p>
</div>

<!-- CTA -->
<div class="cta fade">
  <h2>감초식당에서 당신의 한 끼를 기다립니다</h2>
  <a href="tel:064-743-8988" class="btn">전화 예약</a>
</div>

<script>
// fade in
const items = document.querySelectorAll('.fade');

const observer = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});

items.forEach(el=>observer.observe(el));
</script>

</body>
</html>
