<style>
body{font-family:'Pretendard',Arial;margin:0;background:#f7f3ee;}

.banner{position:relative;height:320px;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;display:block;}
.banner::after{
content:"";
position:absolute;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.35);
z-index:1;
}

.banner-text{
position:absolute;
bottom:20px;
left:20px;
color:#fff;
z-index:2;
text-shadow:0 2px 6px rgba(0,0,0,0.6);
}

.container{padding:18px;}

h2{
margin-top:40px;
font-size:20px;
color:#6b3f2b;
border-left:6px solid #c8a27a;
padding-left:10px;
}

.lang-buttons{
display:flex;
justify-content:center;
gap:8px;
margin:15px 0;
}

.lang-buttons button{
padding:8px 12px;
background:#6b3f2b;
color:#fff;
border:none;
border-radius:20px;
cursor:pointer;
}

.lang-buttons button.active{background:#c8a27a;}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
}

.menu-card{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 14px rgba(0,0,0,0.08);
cursor:pointer;
transition:0.2s;
position:relative;
}

.menu-card:hover{transform:translateY(-4px);}

.menu-card img{
width:100%;
height:160px;
object-fit:cover;
}

.menu-info{padding:10px;}

.price{
color:#a0522d;
font-weight:bold;
font-size:16px;
}

.badge{
position:absolute;
top:10px;
left:10px;
background:linear-gradient(45deg,#ff5a5a,#ff2e2e);
color:#fff;
padding:4px 7px;
font-size:11px;
border-radius:6px;
font-weight:bold;
z-index:10;
}

.modal{
display:none;
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
z-index:999;
}

.modal-content{text-align:center;margin-top:5%;}
.modal img{max-width:90%;max-height:75%;border-radius:12px;}
.modal p{color:#fff;margin-top:10px;}

.btn{
display:inline-block;
padding:12px 18px;
background:#6b3f2b;
color:#fff;
border-radius:10px;
text-decoration:none;
margin-top:10px;
font-weight:bold;
}

.btn.secondary{background:#c8a27a;}

.map-box{
margin-top:10px;
border-radius:12px;
overflow:hidden;
}
</style>
</head>

const categoryNames={
meal:"🍲 식사 메뉴",
hotpot:"🍖 전골 / 요리",
set:"🍢 세트 메뉴"
};

function renderMenu(){
 const area=document.getElementById("menuArea");
 area.innerHTML="";

 Object.keys(categoryNames).forEach(cat=>{
  area.innerHTML+=`<h2>${categoryNames[cat]}</h2><div class="menu-grid" id="${cat}"></div>`;

  menuData.filter(m=>m.cat===cat).forEach(item=>{
   document.getElementById(cat).innerHTML+=`
   <div class="menu-card" onclick="openModal('${item.img}','${item.name[currentLang]}')">
     ${item.best?'<div class="badge">BEST</div>':''}
     <img src="${item.img}">
     <div class="menu-info">
       <h3>${item.name[currentLang]}</h3>
       <p>${item.desc[currentLang]}</p>
       <p class="price">${item.price}</p>
     </div>
   </div>`;
  });
 });
}

function setLang(lang, el){
 currentLang=lang;
 document.querySelectorAll(".lang-buttons button")
  .forEach(b=>b.classList.remove("active"));
 el.classList.add("active");
 renderMenu();
}

function openModal(img,text){
 document.getElementById("modal").style.display="block";
 document.getElementById("modalImg").src=img;
 document.getElementById("modalText").innerText=text;
}

document.getElementById("modal").onclick=function(e){
 if(e.target===this)this.style.display="none";
};

document.addEventListener("keydown",e=>{
 if(e.key==='Escape')
 document.getElementById("modal").style.display="none";
});

document.querySelector(".lang-buttons button").classList.add("active");

renderMenu();
</script>
