<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감초식당 신제주점</title>

<style>
body{font-family:'Pretendard',Arial;margin:0;background:#f7f3ee;}

.banner{position:relative;height:320px;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;}
.banner::after{content:"";position:absolute;width:100%;height:100%;
background:linear-gradient(to top,rgba(0,0,0,0.6),rgba(0,0,0,0.2));}

.banner-text{position:absolute;bottom:20px;left:20px;color:#fff;}

.container{padding:18px;}

h2{margin-top:40px;font-size:20px;color:#6b3f2b;border-left:6px solid #c8a27a;padding-left:10px;}

.lang-buttons{display:flex;justify-content:center;gap:8px;margin:15px 0;}
.lang-buttons button{padding:8px 12px;background:#6b3f2b;color:#fff;border:none;border-radius:20px;cursor:pointer;}
.lang-buttons button.active{background:#c8a27a;}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}

.menu-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,0.08);cursor:pointer;}
.menu-card img{width:100%;height:160px;object-fit:cover;}
.menu-info{padding:10px;}
.price{color:#a0522d;font-weight:bold;}

.badge{position:absolute;top:8px;left:8px;background:#ff5a5a;color:#fff;padding:3px 6px;font-size:11px;border-radius:6px;}

#map{width:100%;height:320px;margin-top:20px;border-radius:12px;}
</style>
</head>

<body>

<div class="banner">
<img src="banner.jpg">
<div class="banner-text">
<h1>감초식당 신제주점</h1>
<p>30년 전통의 맛</p>
</div>
</div>

<div class="container">

<div class="lang-buttons">
<button onclick="setLang('ko',this)">KO</button>
<button onclick="setLang('en',this)">EN</button>
<button onclick="setLang('zh',this)">ZH</button>
<button onclick="setLang('ja',this)">JA</button>
</div>

<div id="menuArea"></div>

<h2>📞 전화</h2>
<a href="tel:0647438988">전화 바로걸기</a>

<h2>📍 오시는 길</h2>
<div id="map"></div>

</div>

<!-- 카카오 지도 -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>

<script>
let currentLang="ko";

/* ✅ 최소 테스트용 메뉴 (확실한 동작 보장) */
const menuData=[
{
cat:"meal",
img:"menu1.jpg",
best:true,
name:{ko:"순대국밥",en:"Sundae Soup",zh:"米肠汤",ja:"スンデスープ"},
desc:{ko:"대표 메뉴",en:"Signature dish",zh:"招牌菜",ja:"人気メニュー"},
price:"9,000원"
},
{
cat:"meal",
img:"menu2.png",
name:{ko:"돼지국밥",en:"Pork Soup",zh:"猪肉汤",ja:"豚スープ"},
desc:{ko:"담백한 맛",en:"Light taste",zh:"清淡",ja:"あっさり"},
price:"9,000원"
}
];

const categoryNames={
meal:"🍲 식사 메뉴"
};

function renderMenu(){
 const area=document.getElementById("menuArea");
 area.innerHTML="";

 Object.keys(categoryNames).forEach(cat=>{
  area.innerHTML+=`<h2>${categoryNames[cat]}</h2><div class="menu-grid" id="${cat}"></div>`;

  menuData.filter(m=>m.cat===cat).forEach(item=>{
   document.getElementById(cat).innerHTML+=`
   <div class="menu-card">
     ${item.best?'<div class="badge">BEST</div>':''}
     <img src="${item.img}">
     <div class="menu-info">
       <h3>${item.name[currentLang]}</h3>
       <p>${item.desc[currentLang]}</p>
       <p class="price">${item.price}</p>
     </div>
   </div>`;
  });
 });
}

function setLang(lang,el){
 currentLang=lang;
 document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
 el.classList.add("active");
 renderMenu();
}

document.querySelector("button").classList.add("active");
renderMenu();

/* ✅ 지도 */
window.onload=function(){
 var mapContainer=document.getElementById('map');
 var mapOption={
  center:new kakao.maps.LatLng(33.4996,126.5312),
  level:3
 };

 var map=new kakao.maps.Map(mapContainer,mapOption);

 var marker=new kakao.maps.Marker({
  position:mapOption.center
 });

 marker.setMap(map);

 setTimeout(function(){
  map.relayout();
  map.setCenter(mapOption.center);
 },300);
};
</script>

</body>
</html>
