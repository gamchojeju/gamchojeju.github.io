<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감초식당 신제주점</title>

<style>
body{font-family:'Pretendard',Arial;margin:0;background:#f7f3ee;}

.banner{position:relative;height:320px;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;}
.banner::after{content:"";position:absolute;width:100%;height:100%;
background:linear-gradient(to top,rgba(0,0,0,0.6),rgba(0,0,0,0.2));}

.banner-text{position:absolute;bottom:20px;left:20px;color:#fff;
text-shadow:0 2px 6px rgba(0,0,0,0.6);}

.container{padding:18px;}

h2{
margin-top:40px;
font-size:20px;
color:#6b3f2b;
border-left:6px solid #c8a27a;
padding-left:10px;
}

.lang-buttons{
display:flex;
justify-content:center;
gap:8px;
margin:15px 0;
}

.lang-buttons button{
padding:8px 12px;
background:#6b3f2b;
color:#fff;
border:none;
border-radius:20px;
cursor:pointer;
}

.lang-buttons button.active{
background:#c8a27a;
}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
}

.menu-card{
background:#fff;
border-radius:14px;
overflow:hidden;
box-shadow:0 6px 14px rgba(0,0,0,0.08);
cursor:pointer;
position:relative;
transition:0.2s;
}

.menu-card:hover{transform:translateY(-4px);}

.menu-card img{
width:100%;
height:160px;
object-fit:cover;
}

.menu-info{padding:10px;}

.price{
color:#a0522d;
font-weight:bold;
font-size:16px;
letter-spacing:0.5px;
}

.badge{
position:absolute;
top:8px;
left:8px;
background:linear-gradient(45deg,#ff5a5a,#ff2e2e);
color:#fff;
padding:3px 6px;
font-size:11px;
border-radius:6px;
font-weight:bold;
}

.modal{
display:none;
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
z-index:999;
}

.modal-content{text-align:center;margin-top:5%;}
.modal img{max-width:90%;max-height:75%;border-radius:12px;}
.modal p{color:#fff;margin-top:10px;}

#map{
width:100%;
height:320px;
margin-top:20px;
border-radius:12px;
overflow:hidden;
}
</style>
</head>

<body>

<div class="banner">
<img src="banner.jpg">
<div class="banner-text">
<h1>감초식당 신제주점</h1>
<p>1994년부터 30년간 이어진 변함없는 어머님의 그 맛, 그대로!</p>
</div>
</div>

<div class="container">

<div class="lang-buttons">
<button onclick="setLang('ko', this)">KO</button>
<button onclick="setLang('en', this)">EN</button>
<button onclick="setLang('zh', this)">ZH</button>
<button onclick="setLang('ja', this)">JA</button>
</div>

<div id="menuArea"></div>

<!-- 🔥 전화 -->
<h2>📞 전화</h2>
<a href="tel:0647438988">전화 바로걸기</a>

<!-- 🔥 지도 -->
<h2>📍 오시는 길</h2>
<div id="map"></div>

<p style="font-size:13px; color:gray;">
제주시 노연로 144 1층 (구)코스모스호텔사거리 / 주차 가능
</p>

</div>

<!-- 모달 -->
<div id="modal" class="modal">
<div class="modal-content">
<img id="modalImg">
<p id="modalText"></p>
</div>
</div>

<!-- 🔥 카카오 지도 SDK -->
<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY"></script>

<script>
let currentLang="ko";

/* ================= 메뉴 데이터 ================= */
const menuData=[ /* 그대로 유지 (생략 없이 그대로 사용하면 됨) */ ];

/* ================= 메뉴 렌더 ================= */
function renderMenu(){
 const area=document.getElementById("menuArea");
 area.innerHTML="";

 const categoryNames={
 meal:"🍲 식사 메뉴",
 hotpot:"🍖 전골 / 요리",
 set:"🍢 세트 메뉴"
 };

 Object.keys(categoryNames).forEach(cat=>{
  area.innerHTML+=`<h2>${categoryNames[cat]}</h2><div class="menu-grid" id="${cat}"></div>`;

  menuData.filter(m=>m.cat===cat).forEach(item=>{
   document.getElementById(cat).innerHTML+=`
   <div class="menu-card" onclick="openModal('${item.img}','${item.name[currentLang]}')">
     ${item.best?'<div class="badge">BEST</div>':''}
     <img src="${item.img}">
     <div class="menu-info">
       <h3>${item.name[currentLang]}</h3>
       <p>${item.desc[currentLang]}</p>
       <p class="price">${item.price}</p>
     </div>
   </div>`;
  });
 });
}

/* ================= 언어 변경 ================= */
function setLang(lang, el){
 currentLang=lang;
 document.querySelectorAll(".lang-buttons button")
  .forEach(b=>b.classList.remove("active"));
 el.classList.add("active");
 renderMenu();
}

/* ================= 모달 ================= */
function openModal(img,text){
 document.getElementById("modal").style.display="block";
 document.getElementById("modalImg").src=img;
 document.getElementById("modalText").innerText=text;
}

document.getElementById("modal").onclick=function(e){
 if(e.target===this)this.style.display="none";
};

document.addEventListener("keydown",e=>{
 if(e.key==='Escape')
 document.getElementById("modal").style.display="none";
});

/* ================= 초기 실행 ================= */
document.querySelector(".lang-buttons button").classList.add("active");
renderMenu();

/* ================= 🔥 지도 ================= */
window.onload = function(){

 var container = document.getElementById('map');

 var options = {
   center: new kakao.maps.LatLng(33.4996, 126.5312),
   level: 3
 };

 var map = new kakao.maps.Map(container, options);

 var marker = new kakao.maps.Marker({
   position: options.center
 });

 marker.setMap(map);

 setTimeout(function(){
   map.relayout();
   map.setCenter(options.center);
 }, 300);
};
</script>

</body>
</html>
